<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXHOUND REGISTRATION</title>
    <link rel="stylesheet" href="foxstyle.css">
</head>
<body>

    <div class="form-box">
        <div class="form-header">
            <h2>NEW AGENT REGISTRATION</h2>
            <p>FREQUENCY: 140.85 // CLEARANCE REQUIRED</p>
        </div>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="reg-user">CODENAME</label>
                <div class="input-wrapper">
                    <input type="text" id="reg-user" placeholder="ENTER CODENAME" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-email">EMAIL ADDRESS</label>
                <div class="input-wrapper">
                    <input type="email" id="reg-email" placeholder="ENTER EMAIL" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-phone">PHONE NUMBER</label>
                <div class="input-wrapper">
                    <input type="tel" id="reg-phone" placeholder="ENTER PHONE NUMBER" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-pass">ACCESS CODE (PASSWORD)</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-pass" placeholder="ENTER PASSWORD" required>
                </div>
            </div>
            <div class="input-group">
                <label for="reg-confirm">CONFIRM ACCESS CODE</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-confirm" placeholder="CONFIRM PASSWORD" required>
                </div>
            </div>
            <button type="submit" class="btn">REGISTER</button>
            <p class="switch-link">ALREADY HAVE AN ACCOUNT? <a href="login2.html">LOGIN HERE</a></p>
        </form>
    </div>

</body>
</html>
